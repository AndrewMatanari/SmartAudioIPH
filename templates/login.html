<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login - IPH Smart Audio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #1e3c72; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { width: 350px; border-radius: 20px; padding: 20px; }
    </style>
</head>
<body>
    <div class="card shadow">
        <h4 class="text-center fw-bold mb-4">IPH LOGIN</h4>
        {% with msgs = get_flashed_messages() %}
            {% if msgs %}{% for m in msgs %}<div class="alert alert-danger py-1 small">{{m}}</div>{% endfor %}{% endif %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="username" class="form-control mb-3" placeholder="Username" required>
            <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>
            <button class="btn btn-primary w-100 fw-bold">Masuk</button>
        </form>
    </div>
</body>
</html>
